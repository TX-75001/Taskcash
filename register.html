<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskCash - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
    }

    .header {
      background: #0b7a3b;
      color: white;
      text-align: center;
      padding: 25px;
    }

    .container {
      max-width: 450px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: #0b7a3b;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .login {
      text-align: center;
      margin-top: 20px;
    }

    a {
      color: #0b7a3b;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>TaskCash</h1>
    <p>Create your account</p>
  </div>

  <div class="container">

    <h2>Register</h2>

    <form>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter your phone number" required>

      <label>Password</label>
      <input type="password" placeholder="Create a password" required>

      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm your password" required>

      <button type="submit">Create Account</button>
    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

  </div>

</body>
    </html>
