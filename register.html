<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskCash Register</title>
</head>

<body style="margin:0;background:#f5f7fa;font-family:Arial;">

  <div style="background:#0b7a3b;color:white;text-align:center;padding:25px;">
    <h1>TaskCash</h1>
    <p>Create your account</p>
  </div>

  <div style="max-width:400px;margin:30px auto;background:white;padding:25px;">

    <h2 style="text-align:center;">Create Account</h2>

    <form>
      <p>Full Name</p>
      <input type="text" placeholder="Full name"
        style="width:100%;padding:12px;box-sizing:border-box;">

      <p>Email</p>
      <input type="email" placeholder="Email"
        style="width:100%;padding:12px;box-sizing:border-box;">

      <p>Phone Number</p>
      <input type="tel" placeholder="Phone number"
        style="width:100%;padding:12px;box-sizing:border-box;">

      <p>Password</p>
      <input type="password" placeholder="Password"
        style="width:100%;padding:12px;box-sizing:border-box;">

      <button type="submit"
        style="width:100%;padding:14px;margin-top:20px;background:#0b7a3b;color:white;border:0;font-size:16px;">
        Create Account
      </button>
    </form>

  </div>

</body>
</html>
